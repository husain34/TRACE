[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "trace-memory"
version         = "1.0.2"
description     = "TRACE — Temporal Retrieval And Context Engine: self-healing hierarchical memory for LLM agents."
readme          = "README.md"
license         = { text = "Apache-2.0" }
requires-python = ">=3.9"

keywords = [
    "llm", "rag", "memory", "agent", "context-tree",
    "vector-database", "conversation", "chatbot", "ai",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=1.0.0",         # LLM API client (supports any OpenAI-compatible endpoint)
    "python-dotenv>=1.0.0",  # .env file support
    "sentence-transformers>=2.2.0", # local fallback for embeddings
]


[project.urls]
Homepage    = "https://github.com/husain34/TRACE"
Repository  = "https://github.com/husain34/TRACE"
"Bug Tracker" = "https://github.com/husain34/TRACE/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["trace_memory*"]
